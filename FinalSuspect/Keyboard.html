            <div class="page-head__meta">
                <span><i class="fas fa-clock"></i> <span data-i18n="ui.updated">更新于</span> <time data-last-modified datetime=""></time></span>
            </div>
        </header>

        <div class="prose">

            <h2 class="sec-title" id="general" data-i18n="p.general">模组端快捷键</h2>
            <p data-i18n="p.generalBody">这一组按键不区分身份，只要运行的是 Final Suspect 模组端即可使用。</p>

            <dl class="spec-list">
                <dt><kbd>F11</kbd></dt>
                <dd data-i18n="p.generalKey1">更改分辨率</dd>

                <dt><kbd>F4</kbd></dt>
                <dd data-i18n="p.generalKey2">更改全屏</dd>

                <dt><kbd>F5</kbd><span>+</span><kbd>T</kbd></dt>
                <dd data-i18n="p.generalKey3">重新加载自定义翻译文件</dd>

                <dt><kbd>F5</kbd><span>+</span><kbd>X</kbd></dt>
                <dd data-i18n="p.generalKey4">导出自定义翻译文件</dd>

                <dt><kbd>F1</kbd><span>+</span><kbd>左Ctrl</kbd><span>/</span><kbd>右Ctrl</kbd></dt>
                <dd data-i18n="p.generalKey5">输出日志</dd>

                <dt><kbd>F2</kbd><span>+</span><kbd>左Ctrl</kbd><span>/</span><kbd>右Ctrl</kbd></dt>
                <dd data-i18n="p.generalKey6">游戏中输出日志</dd>

                <dt><kbd>F10</kbd></dt>
                <dd data-i18n="p.generalKey7">打开游戏目录</dd>

                <dt><kbd>TAB</kbd></dt>
                <dd data-i18n="p.generalKey8">显示/隐藏主页 UI</dd>
            </dl>

            <h2 class="sec-title" id="host" data-i18n="p.host">房主专用快捷键</h2>

            <div class="alert alert--warn">
                <span class="alert__icon"><i class="fas fa-crown"></i></span>
                <div class="alert__body">
                    <span class="alert__title" data-i18n="p.hostAlertTitle">生效条件</span>
                    <p data-i18n="p.hostAlertBody">该快捷键仅限自己是房主，且是 FinalSuspect 模组端生效。</p>
                </div>
            </div>

            <dl class="spec-list">
                <dt><kbd>左Shift</kbd><span>/</span><kbd>右Shift</kbd></dt>
                <dd data-i18n="p.hostKey1">将大厅房间倒计时修改为 0s</dd>

                <dt><kbd>C</kbd></dt>
                <dd data-i18n="p.hostKey2">重置房间倒计时</dd>
            </dl>
        </div>
