<body data-shell="full" data-page="feat-resourcemanager" data-rail="features">
    <main>
        <header class="page-head">
            <span class="page-head__label hud-label"><i class="fas fa-folder-tree"></i> FEATURE </span>
            <h1 class="page-title">资源管理</h1>
            <div class="page-head__meta">
                <span><i class="fas fa-folder"></i> 功能</span>
                <span><i class="fas fa-clock"></i> 更新于 <time data-last-modified datetime=""></time></span>
            </div>
        </header>

        <div class="prose">

            <h2 class="sec-title" id="what">功能说明</h2>
            <p>
                该功能可以在「资源管理」中下载本模组的配套以及扩展资源，所有资源都在模组内直接获取。
            </p>
            <p>
                例如「我的音乐」中可用的音乐资源，即可通过资源管理下载，具体说明见
                <a href="MyMusic.html">我的音乐</a>。
            </p>

            <h2 class="sec-title" id="notice">资源列表</h2>
            <div class="alert alert--tip">
                <span class="alert__icon"><i class="fas fa-circle-info"></i></span>
                <div class="alert__body">
                    <span class="alert__title">开头的文件为预下载资源包</span>
                    <p>列表<strong>开头的文件</strong>为<mark>预下载资源包</mark>，其余条目则是可单独下载的配套与扩展资源。</p>
                </div>
            </div>
        </div>

        <div class="pager">
