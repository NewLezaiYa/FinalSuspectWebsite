<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#030308">
    <script>try{if(localStorage.getItem('fs.theme')==='light'){document.documentElement.setAttribute('data-theme','light');var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content','#eef1f7')}}catch(e){}</script>
    <meta name="robots" content="noindex">
    <title>404</title>

    <link rel="stylesheet" href="../Resource/CSS/fonts.css?v=1f5dccea">
    <link rel="stylesheet" href="../Resource/CSS/icons.css?v=1f5dccea">
    <link rel="stylesheet" href="../Resource/CSS/variables.css?v=1f5dccea">
    <link rel="stylesheet" href="../Resource/CSS/components.css?v=1f5dccea">
    <link rel="stylesheet" href="../Resource/CSS/layout.css?v=1f5dccea">
    <link rel="stylesheet" href="../Resource/CSS/pages.css?v=1f5dccea">
    <link rel="stylesheet" href="../Resource/CSS/animations.css?v=1f5dccea">
    <link rel="stylesheet" href="../Resource/CSS/responsive.css?v=1f5dccea">
    <link rel="stylesheet" href="../Resource/CSS/theme.css?v=1f5dccea">
</head>

<body data-shell="full" data-page="404" data-toc="off">
    <main>
        <section class="index-hero" style="min-height:52vh;display:grid;place-content:center;text-align:center">
            <div class="index-hero__bg"></div>
            <span class="index-hero__kick" style="margin:0 auto var(--s-4)">
                <i class="fas fa-triangle-exclamation"></i> ERROR / 404
            </span>
            <h1 style="font-size:clamp(3rem,14vw,7rem);line-height:1;letter-spacing:.04em" class="glitch"
                data-text="404">404</h1>
            <p style="margin:var(--s-4) auto 0;max-width:52ch">
                坐标越界：你要找的页面不在文档索引里。可能是链接过期，或者地址输错了。
            </p>
            <div class="hero__cta" style="margin-top:var(--s-5)">
                <a class="btn btn--primary btn--lg" href="../index.html">
                    <i class="fas fa-house"></i> 返回首页
                </a>
                <a class="btn btn--lg btn--ghost" href="FAQ.html">
                    <i class="fas fa-life-ring"></i> 疑难解答
                </a>
            </div>
            <p class="hud-label" style="margin-top:var(--s-5)">
                <span id="cd">3</span> 秒后自动返回首页
            </p>
        </section>
    </main>

    <script>
        (function () {
            var n = 3;
            var el = document.getElementById('cd');
            var t = setInterval(function () {
                n--;
                if (el) el.textContent = String(Math.max(0, n));
                if (n <= 0) { clearInterval(t); location.replace('../index.html'); }
            }, 1000);
        })();
</script>
    <script src="../Resource/JS/language.js?v=1f5dccea" defer></script>
    <script src="../Resource/JS/versions.js?v=1f5dccea" defer></script>
    <script src="../Resource/JS/shell.js?v=1f5dccea" defer></script>
    <script src="../Resource/JS/transition.js?v=1f5dccea" defer></script>
    <script src="../Resource/JS/effects.js?v=1f5dccea" defer></script>
</body>

</html>
