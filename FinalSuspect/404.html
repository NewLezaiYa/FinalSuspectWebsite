<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>404 · 页面未找到</title>

    <link rel="stylesheet" href="../Resource/CSS/fonts.css?v=b8e931cf">
    <link rel="stylesheet" href="../Resource/CSS/icons.css?v=b8e931cf">
    <link rel="stylesheet" href="../Resource/CSS/variables.css?v=b8e931cf">
    <link rel="stylesheet" href="../Resource/CSS/components.css?v=b8e931cf">
    <link rel="stylesheet" href="../Resource/CSS/layout.css?v=b8e931cf">
    <link rel="stylesheet" href="../Resource/CSS/pages.css?v=b8e931cf">
    <link rel="stylesheet" href="../Resource/CSS/animations.css?v=b8e931cf">
    <link rel="stylesheet" href="../Resource/CSS/responsive.css?v=b8e931cf">
</head>

<body data-shell="full" data-page="404" data-toc="off">
    <main>
        <section class="index-hero" style="min-height:52vh;display:grid;place-content:center;text-align:center">
            <div class="index-hero__bg"></div>
            <span class="index-hero__kick" style="margin:0 auto var(--s-4)">
                <i class="fas fa-triangle-exclamation"></i> ERROR / 404
            </span>
            <h1 style="font-size:clamp(3rem,14vw,7rem);line-height:1;letter-spacing:.04em" class="glitch"
                data-text="404">404</h1>
            <p style="margin:var(--s-4) auto 0;max-width:52ch">
                坐标越界：你要找的页面不在文档索引里。可能是链接过期，或者地址输错了。
            </p>
            <div class="hero__cta" style="margin-top:var(--s-5)">
                <a class="btn btn--primary btn--lg" href="../index.html">
                    <i class="fas fa-house"></i> 返回首页
                </a>
                <a class="btn btn--lg btn--ghost" href="FAQ.html">
                    <i class="fas fa-life-ring"></i> 疑难解答
                </a>
            </div>
            <p class="hud-label" style="margin-top:var(--s-5)">
                <span id="cd">3</span> 秒后自动返回首页
            </p>
        </section>

        <div class="index-tools">
            <span class="index-tools__count">也许你要找的是</span>
        </div>

        <div class="card-grid">
            <a class="card" href="Guide/Installation.html">
                <span class="card__idx">01</span>
                <span class="card__icon"><i class="fas fa-download"></i></span>
                <span class="card__title">安装模组</span>
                <span class="card__desc">Steam / Epic 双平台分步安装指南。</span>
                <span class="card__go">前往 <i class="fas fa-arrow-right"></i></span>
            </a>
            <a class="card" href="Options/index.html">
                <span class="card__idx">02</span>
                <span class="card__icon"><i class="fas fa-sliders"></i></span>
                <span class="card__title">选项总览</span>
                <span class="card__desc">14 项可调开关的完整说明。</span>
                <span class="card__go">前往 <i class="fas fa-arrow-right"></i></span>
            </a>
            <a class="card" href="Changelog.html">
                <span class="card__idx">03</span>
                <span class="card__icon"><i class="fas fa-clock-rotate-left"></i></span>
                <span class="card__title">更新日志</span>
                <span class="card__desc">按版本倒序的完整改动记录。</span>
                <span class="card__go">前往 <i class="fas fa-arrow-right"></i></span>
            </a>
        </div>
    </main>

    <script>
        (function () {
            var n = 3;
            var el = document.getElementById('cd');
            var t = setInterval(function () {
                n--;
                if (el) el.textContent = String(Math.max(0, n));
                if (n <= 0) { clearInterval(t); location.replace('../index.html'); }
            }, 1000);
        })();
</script>
    <script src="../Resource/JS/language.js?v=b8e931cf"></script>
    <script src="../Resource/JS/versions.js?v=b8e931cf"></script>
    <script src="../Resource/JS/shell.js?v=b8e931cf"></script>
    <script src="../Resource/JS/transition.js?v=b8e931cf" defer></script>
    <script src="../Resource/JS/effects.js?v=b8e931cf" defer></script>
</body>

</html>
