    <main>
        <header class="page-head">
            <h1 class="page-title" data-i18n="p.title">使用模组鼠标光标</h1>
            <div class="page-head__meta">
                <span><i class="fas fa-clock"></i> <span data-i18n="ui.updated">更新于</span> <time data-last-modified datetime=""></time></span>
            </div>
        </header>

        <div class="prose">
            <h2 class="sec-title" id="how" data-i18n="p.how">功能说明</h2>
            <p data-i18n="p.howBody">
                启用此功能后，游戏将采用模组提供的定制鼠标光标，替代原版游戏的默认鼠标光标。
            </p>
            <p data-i18n="p.howBody2">
                它只影响光标的显示样式，不影响任何游戏内操作与判定。
            </p>

            <h2 class="sec-title" id="advice" data-i18n="p.advice">提醒</h2>
            <div class="alert alert--tip">
                <span class="alert__icon"><i class="fas fa-lightbulb"></i></span>
                <div class="alert__body">
                    <span class="alert__title" data-i18n="p.adviceTitle">会覆盖你的鼠标光标</span>
                    <p data-i18n-html="p.adviceBody"><strong>该功能会覆盖你的鼠标光标</strong>。</p>
                    <p data-i18n="p.adviceBody2">除非你不喜欢用 Windows 默认鼠标光标，否则一般而言建议关闭。</p>
                </div>
            </div>

            <h2 class="sec-title" id="preview" data-i18n="p.preview">效果示意</h2>
            <figure class="figure">
                <picture>
                    <source srcset="../../Resource/images/Cursor.webp" type="image/webp">
                    <img width="1080" height="1080" data-nowebp src="../../Resource/images/Cursor.png" alt="模组鼠标光标示意图" data-i18n-alt="p.previewAlt"
                        loading="lazy" decoding="async">
                </picture>
                <figcaption data-i18n="p.previewCaption">模组鼠标光标示意图</figcaption>
            </figure>
        </div>
