    <title>使用模组鼠标光标 · FinalSuspect</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;800&family=Poppins:wght@300;400;500;600&family=Share+Tech+Mono&display=swap">

<body data-shell="full" data-page="opt-usemodcursor" data-rail="options">
    <main>
        <header class="page-head">
            <span class="page-head__label hud-label"><i class="fas fa-arrow-pointer"></i> OPTION · 14</span>
            <h1 class="page-title">使用模组鼠标光标</h1>
            <div class="page-head__meta">
                <span><i class="fas fa-folder"></i> 选项</span>
                <span><i class="fas fa-tag"></i> 外观 / 界面</span>
                <span><i class="fas fa-clock"></i> 更新于 <time data-last-modified datetime=""></time></span>
            </div>
        </header>

        <p class="lede">
            启用此功能后，游戏将采用模组提供的定制鼠标光标，
            替代原版游戏的默认鼠标光标。
        </p>

        <div class="facts">
            <div><span class="k">作用</span><span class="v">替换游戏内鼠标光标</span></div>
            <div><span class="k">光标来源</span><span class="v">模组提供的定制光标</span></div>
            <div><span class="k">生效端</span><span class="v">模组端</span></div>
            <div><span class="k">影响平衡</span><span class="v">不影响</span></div>
        </div>

        <div class="prose">
            <h2 class="sec-title" id="how"><span class="sec-title__num">01</span>功能说明</h2>
            <p>
                启用此功能后，游戏将采用模组提供的定制鼠标光标，替代原版游戏的默认鼠标光标。
            </p>

            <h2 class="sec-title" id="preview"><span class="sec-title__num">02</span>效果示意</h2>
            <figure class="figure">
                <img src="../../Resource/images/Cursor.png" alt="模组鼠标光标示意图">
                <figcaption>模组鼠标光标示意图</figcaption>
            </figure>

            <h2 class="sec-title" id="tips"><span class="sec-title__num">03</span>使用建议</h2>
            <div class="alert alert--tip">
                <span class="alert__icon"><i class="fas fa-lightbulb"></i></span>
                <div class="alert__body">
                    <span class="alert__title">开启前请注意</span>
                    <p><mark>该功能会覆盖你的鼠标光标</mark>。</p>
                    <p>除非你不喜欢用 Windows 默认鼠标光标，否则一般而言建议关闭。</p>
                </div>
            </div>
        </div>

        <div class="pager">
            <a class="pager__item" href="UnlockFPS">
