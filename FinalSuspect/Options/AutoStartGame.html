    <title>人满自动开始游戏</title>

<body data-shell="full" data-page="opt-autostartgame" data-rail="options">
    <main>
        <header class="page-head">
            <span class="page-head__label hud-label"><i class="fas fa-users-cog"></i> OPTION </span>
            <h1 class="page-title">人满自动开始游戏</h1>
            <div class="page-head__meta">
                <span><i class="fas fa-folder"></i> 选项</span>
                <span><i class="fas fa-clock"></i> 更新于 <time data-last-modified datetime=""></time></span>
            </div>
        </header>

        <div class="prose">

            <h2 class="sec-title" id="how">功能说明</h2>
            <p>
                本功能优化了自动开始游戏的逻辑，使房间人数接近满员时即可触发倒计时，
                而不必等到房间里一个空位都不剩。
            </p>
            <p>
                当房间玩家人数达到<mark>最大值 - 1</mark>（即仅差 1 人满员）时，
                会启动 <strong>10 秒</strong>的短倒计时；倒计时期间，房主可手动取消。
            </p>

        </div>

        <div class="pager">
            <a class="pager__item" href="AutoEndGame">
                <small>上一篇</small>
                <b>← 结束时自动返回大厅</b>
            </a>
            <a class="pager__item pager__item--next" href="EnableFAC">
                <small>下一篇</small>
                <b>启用反作弊（FAC） →</b>
            </a>
        </div>
    </main>
