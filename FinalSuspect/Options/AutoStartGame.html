            <div class="page-head__meta">

            </div>

        <div class="prose">

            <h2 class="sec-title" id="how" data-i18n="p.how">功能说明</h2>
            <p data-i18n="p.howBody">
                本功能优化了自动开始游戏的逻辑，使房间人数接近满员时即可触发倒计时，
                而不必等到房间里一个空位都不剩。
            </p>
            <p data-i18n-html="p.howBody2">
                当房间玩家人数达到<mark>最大值 - 1</mark>（即仅差 1 人满员）时，
                会启动 <strong>10 秒</strong>的短倒计时；倒计时期间，房主可手动取消。
            </p>

        </div>
