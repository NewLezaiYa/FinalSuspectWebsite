            <h2 class="sec-title" id="how"><span class="sec-title__num">01</span>功能说明</h2>
            <p>
                原版游戏客户端默认将帧率限制在 <strong>60FPS</strong>，启用此功能后可解除该限制，
                最高支持 <strong>165FPS</strong> 的流畅画面表现。
            </p>
            <p>
                高帧率模式能显著提升游戏动画的顺滑度和操作响应速度。
            </p>
