<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#030308">
    <script>try{if(localStorage.getItem('fs.theme')==='light'){document.documentElement.setAttribute('data-theme','light');var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content','#eef1f7')}}catch(e){}</script>
    <title>禁用原版游戏音乐</title>

    <link rel="stylesheet" href="../../Resource/CSS/fonts.css?v=3b9af7ce">
    <link rel="stylesheet" href="../../Resource/CSS/icons.css?v=3b9af7ce">

    <link rel="stylesheet" href="../../Resource/CSS/theme.css?v=3b9af7ce">
</head>

<body data-shell="full" data-page="opt-disablevanillasound" data-rail="options">
    <main>
        <header class="page-head">
            <span class="page-head__label hud-label"><i class="fas fa-volume-xmark"></i> OPTION </span>
            <h1 class="page-title">禁用原版游戏音乐</h1>
            <div class="page-head__meta">
                <span><i class="fas fa-folder"></i> 选项</span>
                <span><i class="fas fa-clock"></i> 更新于 <time data-last-modified datetime=""></time></span>
            </div>
        </header>

        <div class="prose">

            <h2 class="sec-title" id="how">功能说明</h2>
            <p>
                该选项允许玩家屏蔽<strong>大厅等待音乐</strong>。启用后相关场景将保持静默，
                大厅里不会再循环播放原版的那段音乐。
            </p>
            <p>
                这一设定适合希望自定义播放器音乐、或需要减少重复音频干扰的玩家；
                该设定可通过<mark>模组配置菜单</mark>随时调整，功能不影响游戏音效。
            </p>

        </div>

        <div class="pager">
            <a class="pager__item" href="EnableFAC">
                <small>上一篇</small>
                <b>← 启用反作弊（FAC）</b>
            </a>
            <a class="pager__item pager__item--next" href="FastBoot">
                <small>下一篇</small>
                <b>快速启动模式 →</b>
            </a>
        </div>
    </main>

</body>

</html>
