<body data-shell="full" data-page="opt-fastboot" data-rail="options">
    <main>
        <header class="page-head">
            <h1 class="page-title" data-i18n="p.title">快速启动模式</h1>
            <div class="page-head__meta">
                <span><i class="fas fa-clock"></i> <span data-i18n="ui.updated">更新于</span> <time data-last-modified datetime=""></time></span>
            </div>
        </header>

        <div class="prose">

            <h2 class="sec-title" id="how" data-i18n="p.how">功能说明</h2>
            <p data-i18n-html="p.howBody">
                快速启动模式用于优化游戏加载流程，启用后系统将<strong>跳过非必要环节</strong>。
            </p>
            <p data-i18n-html="p.howBody2">
                经实测，常规启动耗时约 <strong>15 秒</strong>，启用快速启动后仅需 <mark>5 秒</mark>即可直达主菜单。
            </p>

            <h2 class="sec-title" id="figure" data-i18n="p.figure">快速启动模式示意图</h2>
            <figure class="figure">
                <picture>
                    <source srcset="../../Resource/images/FastBoot.webp" type="image/webp">
                    <img width="1920" height="1080" data-nowebp src="../../Resource/images/FastBoot.png" alt="快速启动模式示意图" data-i18n-alt="p.figureAlt"
                        loading="lazy" decoding="async">
                </picture>
                <figcaption data-i18n="p.figureCaption">快速启动模式示意图</figcaption>
            </figure>

            <h2 class="sec-title" id="notice" data-i18n="p.notice">注意</h2>
            <div class="alert alert--tip">
                <span class="alert__icon"><i class="fas fa-lightbulb"></i></span>
                <div class="alert__body">
                    <span class="alert__title" data-i18n="p.noticeTitle">首次安装与大版本更新</span>
                    <p data-i18n="p.noticeBody">首次安装或大版本更新时仍需完整加载资源，这一段加载无法被快速启动省掉。</p>
                </div>
            </div>

        </div>

        <div class="pager">
            <a class="pager__item" href="DisableVanillaSound">
                <small data-i18n="ui.prev">上一篇</small>
                <b>← <span data-i18n="p.pagerPrev">禁用原版游戏音乐</span></b>
            </a>
            <a class="pager__item pager__item--next" href="KickPlayerWithAbnormalFriendCode">
