<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#030308">
    <script>try{if(localStorage.getItem('fs.theme')==='light'){document.documentElement.setAttribute('data-theme','light');var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content','#eef1f7')}}catch(e){}</script>
    <title>快速启动模式</title>

    <link rel="stylesheet" href="../../Resource/CSS/fonts.css?v=1f5dccea">
    <link rel="stylesheet" href="../../Resource/CSS/icons.css?v=1f5dccea">
    <link rel="stylesheet" href="../../Resource/CSS/variables.css?v=1f5dccea">
    <link rel="stylesheet" href="../../Resource/CSS/components.css?v=1f5dccea">
    <link rel="stylesheet" href="../../Resource/CSS/layout.css?v=1f5dccea">
    <link rel="stylesheet" href="../../Resource/CSS/pages.css?v=1f5dccea">
    <link rel="stylesheet" href="../../Resource/CSS/animations.css?v=1f5dccea">
    <link rel="stylesheet" href="../../Resource/CSS/responsive.css?v=1f5dccea">
    <link rel="stylesheet" href="../../Resource/CSS/theme.css?v=1f5dccea">
</head>

<body data-shell="full" data-page="opt-fastboot" data-rail="options">
    <main>
        <header class="page-head">
            <span class="page-head__label hud-label"><i class="fas fa-bolt"></i> OPTION </span>
            <h1 class="page-title">快速启动模式</h1>
            <div class="page-head__meta">
                <span><i class="fas fa-folder"></i> 选项</span>
                <span><i class="fas fa-clock"></i> 更新于 <time data-last-modified datetime=""></time></span>
            </div>
        </header>

        <div class="prose">

            <h2 class="sec-title" id="how">功能说明</h2>
            <p>
                快速启动模式用于优化游戏加载流程，启用后系统将<strong>跳过非必要环节</strong>。
            </p>
            <p>
                经实测，常规启动耗时约 <strong>15 秒</strong>，启用快速启动后仅需 <mark>5 秒</mark>即可直达主菜单。
            </p>

            <h2 class="sec-title" id="figure">界面示意</h2>
            <figure class="figure">
                <picture>
                    <source srcset="../../Resource/images/FastBoot.webp" type="image/webp">
                    <img width="1920" height="1080" data-nowebp src="../../Resource/images/FastBoot.png" alt="快速启动模式示意图" loading="lazy"
                        decoding="async">
                </picture>
                <figcaption>快速启动模式示意图</figcaption>
            </figure>

            <h2 class="sec-title" id="notice">注意</h2>
            <div class="alert alert--tip">
                <span class="alert__icon"><i class="fas fa-lightbulb"></i></span>
                <div class="alert__body">
                    <span class="alert__title">首次安装与大版本更新</span>
                    <p>首次安装或大版本更新时仍需完整加载资源，这一段加载无法被快速启动省掉。</p>
                </div>
            </div>

        </div>

        <div class="pager">
            <a class="pager__item" href="DisableVanillaSound">
                <small>上一篇</small>
                <b>← 禁用原版游戏音乐</b>
            </a>
            <a class="pager__item pager__item--next" href="KickPlayerWithAbnormalFriendCode">
                <small>下一篇</small>
                <b>踢出好友代码异常的玩家 →</b>
            </a>
        </div>
    </main>

    <script src="../../Resource/JS/language.js?v=1f5dccea" defer></script>
    <script src="../../Resource/JS/versions.js?v=1f5dccea" defer></script>
    <script src="../../Resource/JS/shell.js?v=1f5dccea" defer></script>
    <script src="../../Resource/JS/transition.js?v=1f5dccea" defer></script>
    <script src="../../Resource/JS/effects.js?v=1f5dccea" defer></script>
    <script src="../../Resource/JS/last-modified.js?v=1f5dccea" defer></script>
    <script src="../../Resource/JS/time.js?v=1f5dccea" defer></script>
</body>

</html>
