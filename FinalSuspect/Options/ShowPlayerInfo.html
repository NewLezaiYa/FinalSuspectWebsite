    <title data-i18n="p.title">展示玩家平台与客户端信息</title>

<body data-shell="full" data-page="opt-showplayerinfo" data-rail="options">
    <main>
        <header class="page-head">
            <h1 class="page-title" data-i18n="p.title">展示玩家平台与客户端信息</h1>
            <div class="page-head__meta">
                <span><i class="fas fa-clock"></i> <span data-i18n="ui.updated">更新于</span> <time data-last-modified datetime=""></time></span>
            </div>
        </header>

        <div class="prose">
            <h2 class="sec-title" id="how" data-i18n="p.how">功能说明</h2>
            <p data-i18n-html="p.howBody">
                启用该选项后，在大厅等待时，所有玩家的所属平台（如 <strong>Steam</strong>、<strong>Epic</strong>
                等）及好友代码将会显示在玩家下方。
                Starlight玩家则不显示所属平台。
            </p>

            <h2 class="sec-title" id="preview" data-i18n="p.preview">效果示意</h2>
            <figure class="figure">
                <picture>
                    <source srcset="../../Resource/images/ShowPlayerInfo.webp" type="image/webp">
                    <img width="327" height="286" data-nowebp src="../../Resource/images/ShowPlayerInfo.png"
                        alt="展示玩家平台与客户端信息示意图" data-i18n-alt="p.previewAlt" loading="lazy" decoding="async">
                </picture>
                <figcaption data-i18n="p.previewCaption">展示玩家平台与客户端信息示意图</figcaption>
            </figure>

            <h2 class="sec-title" id="privacy" data-i18n="p.privacy">录制提醒</h2>
            <div class="alert alert--warn">
                <span class="alert__icon"><i class="fas fa-triangle-exclamation"></i></span>
                <div class="alert__body">
                    <span class="alert__title" data-i18n="p.privacyTitle">直播与录制时建议关闭</span>
                    <p data-i18n-html="p.privacyBody">在进行直播、素材录制等活动时建议<strong>关闭此功能</strong>来保护隐私。</p>
                </div>
            </div>
        </div>

        <div class="pager">
            <a class="pager__item" href="OfflineMode.html">
                <small data-i18n="ui.prev">上一篇</small>
                <b>← <span data-i18n="p.pagerPrev">离线模式（试验性）</span></b>
            </a>
            <a class="pager__item pager__item--next" href="SpamDenyWord.html">
                <small data-i18n="ui.next">下一篇</small>
                <b><span data-i18n="p.pagerNext">屏蔽违禁词</span> →</b>
            </a>
        </div>
    </main>
