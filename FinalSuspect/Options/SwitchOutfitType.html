    <main>
        <header class="page-head">
            <h1 class="page-title" data-i18n="p.title">切换外观形象</h1>
            <div class="page-head__meta">
                <span><i class="fas fa-clock"></i> <span data-i18n="ui.updated">更新于</span> <time data-last-modified datetime=""></time></span>
            </div>
        </header>

        <div class="prose">
            <h2 class="sec-title" id="how" data-i18n="p.how">功能说明</h2>
            <p data-i18n-html="p.howBody">
                该选项为玩家提供了<strong>三种可切换的太空人形象</strong>，切换入口在设置菜单中。
            </p>
            <p data-i18n="p.howBody2">
                不同形象只改变角色的外观表现，不改变任何玩法规则。
            </p>

            <h2 class="sec-title" id="modes" data-i18n="p.modes">三种形象</h2>
            <div class="steps">
                <div class="step">
                    <div class="step__body">
                        <p data-i18n-html="p.modesItem1Title"><strong>经典豆子模式</strong></p>
                        <p data-i18n-html="p.modesItem1Body">官方默认，还是你最熟悉的太空<strong>豆子</strong>造型。</p>
                    </div>
                </div>
                <div class="step">
                    <div class="step__body">
                        <p data-i18n-html="p.modesItem2Title"><strong>愚人节牧马模式</strong></p>
                        <p data-i18n-html="p.modesItem2Body">恶搞风格，将角色替换为滑稽的<strong>牧马</strong>形象（参考官方愚人节彩蛋）。</p>
                    </div>
                </div>
                <div class="step">
                    <div class="step__body">
                        <p data-i18n-html="p.modesItem3Title"><strong>愚人节长颈豆模式</strong></p>
                        <p data-i18n-html="p.modesItem3Body">趣味变体，角色变成脖子超长的<strong>长颈豆</strong>，致敬官方愚人节特殊外观。</p>
                    </div>
                </div>
            </div>

            <h2 class="sec-title" id="tips" data-i18n="p.tips">提示</h2>
            <div class="alert alert--tip">
                <span class="alert__icon"><i class="fas fa-lightbulb"></i></span>
                <div class="alert__body">
                    <span class="alert__title" data-i18n="p.tipsTitle">可自由切换</span>
                    <p data-i18n="p.tipsBody">玩家可在设置菜单中自由切换模式。</p>
                    <p data-i18n="p.tipsBody2">该功能不影响游戏平衡，仅为娱乐性扩展。</p>
                </div>
            </div>
        </div>

        <div class="pager">
            <a class="pager__item" href="SpamDenyWord.html">
