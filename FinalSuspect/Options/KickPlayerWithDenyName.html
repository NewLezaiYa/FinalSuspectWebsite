            <h2 class="sec-title" id="how" data-i18n="p.how">功能说明</h2>
            <p data-i18n-html="p.howBody">
                当您是房主时，若 Final Suspect 检测到有人使用了违规昵称（如包含敏感词等<strong>破坏游戏体验</strong>的名称），
                系统将自动踢出该玩家。
            </p>
            <p data-i18n="p.howBody2">
                该功能可有效维护房间秩序，避免恶意名称对其他玩家造成干扰。
            </p>
