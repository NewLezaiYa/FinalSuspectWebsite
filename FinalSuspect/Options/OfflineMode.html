                在 Final Suspect 中，当你启动离线模式，将不会从<strong>远程获取资源</strong>。
            </p>
            <p>
                也就是说，模组运行所需的资源不再走远程获取这条链路；该功能当前属于<strong>试验性功能</strong>
            </p>
