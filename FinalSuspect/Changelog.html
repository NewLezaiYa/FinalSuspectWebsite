<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#030308">
    <script>try { if (localStorage.getItem('fs.theme') === 'light') { document.documentElement.setAttribute('data-theme', 'light'); var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', '#eef1f7') } } catch (e) { }</script>
    <title data-i18n="p.docTitle">更新日志</title>

    <link rel="stylesheet" href="../Resource/CSS/fonts.css?v=3e933278">
    <link rel="stylesheet" href="../Resource/CSS/icons.css?v=3e933278">
    <link rel="stylesheet" href="../Resource/CSS/variables.css?v=3e933278">
    <link rel="stylesheet" href="../Resource/CSS/components.css?v=3e933278">
    <link rel="stylesheet" href="../Resource/CSS/layout.css?v=3e933278">
    <link rel="stylesheet" href="../Resource/CSS/pages.css?v=3e933278">
    <link rel="stylesheet" href="../Resource/CSS/animations.css?v=3e933278">
    <link rel="stylesheet" href="../Resource/CSS/responsive.css?v=3e933278">
    <link rel="stylesheet" href="../Resource/CSS/theme.css?v=3e933278">
</head>

<body data-shell="full" data-page="changelog" data-rail="logs" data-toc="off">
    <main>
        <header class="page-head">
            <h1 class="page-title" data-i18n="p.title">版本更新日志</h1>
            <div class="page-head__meta">
                <span><i class="fas fa-code-branch"></i> <b id="clVersionCount">—</b> <span data-i18n="ui.changelog.versionsSuffix">个版本</span></span>
                <span><i class="fas fa-list-check"></i> <b id="clItemCount">—</b> <span data-i18n="ui.changelog.itemsSuffix">条改动</span></span>
                <span><i class="fas fa-clock"></i> <span data-i18n="ui.updated">更新于</span> <time data-last-modified datetime=""></time></span>
            </div>
        </header>

        <div class="chips" id="clChips" role="group" aria-label="按改动类型筛选" data-i18n-aria-label="ui.changelog.filterLabel">
            <button class="chip" type="button" data-filter="all" aria-pressed="true" data-i18n="ui.changelog.filterAll">全部改动</button>
            <button class="chip" type="button" data-filter="fix" aria-pressed="false" data-i18n="ui.changelog.kindFix">修复</button>
            <button class="chip" type="button" data-filter="opt" aria-pressed="false" data-i18n="ui.changelog.kindOpt">优化</button>
            <button class="chip" type="button" data-filter="change" aria-pressed="false" data-i18n="ui.changelog.kindChange">调整</button>
            <button class="chip" type="button" data-filter="add" aria-pressed="false" data-i18n="ui.changelog.kindAdd">新增</button>
            <button class="chip" type="button" data-filter="remove" aria-pressed="false" data-i18n="ui.changelog.kindRemove">移除</button>
            <button class="chip" type="button" data-filter="reset" aria-pressed="false" data-i18n="ui.changelog.kindReset">重置</button>
        </div>


        <div class="timeline" id="changelogTimeline">
            <noscript>
                <div class="alert alert--warn">
                    <span class="alert__icon"><i class="fas fa-triangle-exclamation"></i></span>
                    <div class="alert__body">
                        <span class="alert__title" data-i18n="ui.changelog.jsOffTitle">需要启用 JavaScript</span>
                        <p data-i18n-html="ui.changelog.jsOffBody">更新日志由 <code>Resource/ModNews</code> 里的 Markdown 文件渲染，请开启 JavaScript 后刷新页面。</p>
                    </div>
                </div>
            </noscript>
        </div>

        <div class="alert alert--tip" style="margin-top:var(--s-6)">
            <span class="alert__icon"><i class="fas fa-lightbulb"></i></span>
            <div class="alert__body">
                <span class="alert__title" data-i18n="ui.changelog.tipTitle">找不到你关心的改动？</span>
                <p data-i18n-html="ui.changelog.tipBody">用页面顶部的搜索（<kbd>Ctrl</kbd> + <kbd>K</kbd>）可以直接跳转到功能或选项说明，
                    也可以先去 <a href="FAQ">疑难解答</a> 看看是否是已知问题。</p>
            </div>
        </div>
    </main>

    <script src="../Resource/JS/changelog-source.js?v=3e933278"></script>
    <script>
        (function () {
            'use strict';

            var host = document.getElementById('changelogTimeline');
            if (!host) return;

            var src = window.ChangelogSource;

            /* 不缓存 window.I18N：本脚本先于 defer 的 language.js 执行 */
            function t(key, params) {
                return (window.I18N && window.I18N.t(key, params)) || '';
            }

            function esc(s) {
                return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
                });
            }

            function md(text) {
                return src ? src.inline(text) : esc(text);
            }

            function setText(id, text) {
                var node = document.getElementById(id);
                if (node) node.textContent = text;
            }

            /* 改动类型 → 语言键（文案在 Resource/lang/*.json 的 ui.changelog.* 下） */
            var KIND = {
                fix: { key: 'ui.changelog.kindFix', icon: 'fa-wrench', cls: 'fix', tone: 'red' },
                opt: { key: 'ui.changelog.kindOpt', icon: 'fa-gauge-high', cls: 'opt', tone: 'cyan' },
                change: { key: 'ui.changelog.kindChange', icon: 'fa-sliders', cls: 'change', tone: 'amber' },
                add: { key: 'ui.changelog.kindAdd', icon: 'fa-plus', cls: 'add', tone: 'green' },
                remove: { key: 'ui.changelog.kindRemove', icon: 'fa-minus', cls: 'remove', tone: 'purple' },
                reset: { key: 'ui.changelog.kindReset', icon: 'fa-rotate-left', cls: 'reset', tone: 'pink' }
            };
            var ORDER = ['fix', 'opt', 'change', 'add', 'reset', 'remove'];

            var data = [];
            var current = 0;
            var currentFilter = 'all';
            var observer = null;

            function kindLabel(kind) {
                return KIND[kind] ? t(KIND[kind].key) : kind;
            }

            function fail(message) {
                var hintKey = location.protocol === 'file:' ? 'ui.changelog.errorFileHint' : 'ui.changelog.errorHttpHint';
                host.innerHTML =
                    '<div class="alert alert--danger">' +
                    '<span class="alert__icon"><i class="fas fa-triangle-exclamation"></i></span>' +
                    '<div class="alert__body">' +
                    '<span class="alert__title">' + esc(t('ui.changelog.errorTitle')) + '</span>' +
                    '<p>' + ((window.I18N && window.I18N.t(hintKey)) || '') + '</p>' +
                    '<p class="tl-error">' + esc(message) + '</p>' +
                    '</div></div>';
            }

            function warnMissing(missing) {
                var names = missing.map(function (m) { return m.file; }).join('、');
                var box = document.createElement('div');
                box.className = 'alert alert--warn';
                box.style.marginBottom = 'var(--s-5)';
                box.innerHTML =
                    '<span class="alert__icon"><i class="fas fa-triangle-exclamation"></i></span>' +
                    '<div class="alert__body">' +
                    '<span class="alert__title">' + esc(t('ui.changelog.missingTitle')) + '</span>' +
                    '<p>' + esc(t('ui.changelog.missingBody', { files: names })) + '</p>' +
                    '</div>';
                host.insertBefore(box, host.firstChild);
            }

            if (!src) { fail(t('ui.changelog.moduleMissing')); return; }

            host.innerHTML = '<div class="tl-loading"><i class="fas fa-rotate"></i> ' +
                esc(t('ui.changelog.loading')) + '</div>';

            /* ---------------------------------------------------------- */
            /* 渲染                                                        */
            /* ---------------------------------------------------------- */
            function render() {
                var html = '';
                var totalItems = 0;

                data.forEach(function (v) {
                    ORDER.forEach(function (k) { if (v.totals[k]) totalItems += v.totals[k]; });

                    var stats = ORDER.filter(function (k) { return v.totals[k]; }).map(function (k) {
                        return '<span class="tag tag--' + KIND[k].tone + '">' +
                            esc(kindLabel(k)) + ' ' + v.totals[k] + '</span>';
                    }).join('');

                    html +=
                        '<article class="tl-version" id="' + esc(v.id) + '" data-version="' + esc(v.version) + '">' +
                        '<header class="tl-version__head">' +
                        '<span class="tl-version__num">v' + esc(v.version) + '</span>' +
                        '<span class="tag tag--' + (v.type === '正式版' ? 'green' : 'amber') + '">' + esc(v.type) + '</span>' +
                        '<span class="tl-version__date"><i class="fas fa-calendar-day"></i> ' + esc(v.date) + '</span>' +
                        '<span class="tl-version__stats">' + stats + '</span>' +
                        '</header>' +
                        leadHtml(v) +
                        metaHtml(v) +
                        peopleHtml(v) +
                        v.groups.map(groupHtml).join('') +
                        pendingHtml(v) +
                        '</article>';
                });

                host.innerHTML = html;
                setText('clVersionCount', data.length);
                setText('clItemCount', totalItems);
            }

            function leadHtml(v) {
                if (!v.summary || !v.summary.length) return '';
                return '<p class="tl-version__lead">' + v.summary.map(md).join('<br>') + '</p>';
            }

            function chip(icon, text) {
                return '<span><i class="fas ' + icon + '"></i>' + md(text) + '</span>';
            }

            function metaHtml(v) {
                var bits = [];
                (v.official || []).forEach(function (line) { bits.push(chip('fa-circle-info', line)); });
                (v.bepinex || []).forEach(function (line) { bits.push(chip('fa-layer-group', line)); });
                if (v.programVersion) bits.push(chip('fa-tag', t('ui.changelog.assemblyPrefix') + ' ' + v.programVersion));
                if (v.build) bits.push(chip('fa-rocket', v.build));
                if (!bits.length) return '';
                return '<div class="tl-version__meta">' + bits.join('') + '</div>';
            }

            function peopleRow(icon, label, people) {
                var items = people.map(function (p) {
                    var safeUrl = /^https?:\/\//i.test(p.url || '') ? p.url : '';
                    var name = safeUrl
                        ? '<a href="' + esc(safeUrl) + '" target="_blank" rel="noopener noreferrer">' + esc(p.name) + '</a>'
                        : esc(p.name);
                    var note = (p.notes && p.notes.length)
                        ? '<em class="tl-people__note">' + md(p.notes.join(' ')) + '</em>'
                        : '';
                    return '<span class="tl-people__item">' + name + note + '</span>';
                }).join('');
                return '<div class="tl-people__row">' +
                    '<span class="tl-people__label"><i class="fas ' + icon + '"></i>' + esc(label) + '</span>' +
                    items +
                    '</div>';
            }

            function peopleHtml(v) {
                var rows = [];
                if (v.team && v.team.length) rows.push(peopleRow('fa-users', t('ui.changelog.teamLabel'), v.team));
                if (v.contributors && v.contributors.length) rows.push(peopleRow('fa-heart', t('ui.changelog.contributorsLabel'), v.contributors));
                return rows.length ? '<div class="tl-people">' + rows.join('') + '</div>' : '';
            }

            function noteHtml(it) {
                if (!it.notes || !it.notes.length) return '';
                return '<em class="tl-item__note">' + it.notes.map(md).join(' · ') + '</em>';
            }

            function groupHtml(g) {
                var meta = KIND[g.kind] || { icon: 'fa-circle', cls: 'change' };
                var items = g.items.map(function (it) {
                    return '<div class="tl-item" data-kind="' + esc(g.kind) + '">' +
                        '<span class="tl-item__body">' + md(it.text) + noteHtml(it) + '</span>' +
                        '</div>';
                }).join('');
                return '<section class="tl-group" data-kind="' + esc(g.kind) + '">' +
                    '<h4 class="tl-group__title c-' + meta.cls + '">' +
                    '<i class="fas ' + meta.icon + ' bg-' + meta.cls + '"></i>' +
                    esc(g.title || kindLabel(g.kind)) +
                    '<span class="cnt">' + esc(t('ui.changelog.itemsCount', { count: g.items.length })) + '</span>' +
                    '</h4>' +
                    '<div class="tl-list">' + items + '</div>' +
                    '</section>';
            }

            function pendingHtml(v) {
                if (!v.pending || !v.pending.length) return '';
                var items = v.pending.map(function (it) {
                    return '<li>' + md(it.text) + noteHtml(it) + '</li>';
                }).join('');
                return '<div class="tl-pending">' +
                    '<span class="tl-pending__title"><i class="fas fa-clock"></i>' +
                    esc(t('ui.changelog.pendingTitle')) + '</span>' +
                    '<ul>' + items + '</ul>' +
                    '</div>';
            }

            /* ---------------------------------------------------------- */
            /* 交互                                                        */
            /* ---------------------------------------------------------- */
            function indexOfVersion(id) {
                for (var i = 0; i < data.length; i++) {
                    if (data[i].id === id) return i;
                }
                return -1;
            }

            function gotoVersion(i) {
                i = Math.max(0, Math.min(data.length - 1, i));
                var version = data[i];
                var node = version && document.getElementById(version.id);
                if (!node) return;
                current = i;
                if (node.scrollIntoView) node.scrollIntoView({ behavior: 'smooth', block: 'start' });
                else window.scrollTo({ top: node.getBoundingClientRect().top + window.scrollY - 132, behavior: 'smooth' });
                history.replaceState(null, '', '#' + version.id);
            }

            function revealHash() {
                if (!location.hash) return;
                var id = location.hash.slice(1);
                try { id = decodeURIComponent(id); } catch (e) { }
                var i = indexOfVersion(id);
                if (i === -1) return;
                current = i;
                var node = document.getElementById(id);
                if (!node) return;
                // html 上设置了 scroll-behavior: smooth，深链接用 instant 才能一步到位；
                // 卡片高度受 content-visibility 影响，渲染稳定前多对齐两次
                var jump = function () {
                    if (node.scrollIntoView) node.scrollIntoView({ behavior: 'instant', block: 'start' });
                    else window.scrollTo(0, node.getBoundingClientRect().top + window.scrollY - 132);
                };
                if (window.requestAnimationFrame) requestAnimationFrame(jump);
                else jump();
                setTimeout(jump, 140);
                setTimeout(jump, 380);
            }

            function applyFilter(filter) {
                if (!data.length) return;
                Array.prototype.forEach.call(host.querySelectorAll('.tl-group'), function (g) {
                    g.style.display = (filter === 'all' || g.getAttribute('data-kind') === filter) ? '' : 'none';
                });
                Array.prototype.forEach.call(host.querySelectorAll('.tl-version'), function (v) {
                    var visible = Array.prototype.some.call(v.querySelectorAll('.tl-group'), function (g) {
                        return g.style.display !== 'none';
                    });
                    v.style.display = visible ? '' : 'none';
                });
            }

            function observe() {
                if (!('IntersectionObserver' in window)) return;
                if (observer) observer.disconnect();
                observer = new IntersectionObserver(function (entries) {
                    entries.forEach(function (en) {
                        if (!en.isIntersecting) return;
                        var i = indexOfVersion(en.target.id);
                        if (i !== -1) current = i;
                    });
                }, { rootMargin: '-140px 0px -70% 0px', threshold: 0 });
                Array.prototype.forEach.call(host.querySelectorAll('.tl-version'), function (a) { observer.observe(a); });
            }

            function bind() {
                var chips = document.getElementById('clChips');
                if (chips) {
                    chips.addEventListener('click', function (e) {
                        var chip = e.target.closest ? e.target.closest('.chip') : null;
                        if (!chip) return;
                        currentFilter = chip.getAttribute('data-filter') || 'all';
                        Array.prototype.forEach.call(chips.querySelectorAll('.chip'), function (c) {
                            c.setAttribute('aria-pressed', String(c === chip));
                        });
                        applyFilter(currentFilter);
                    });
                }

                document.addEventListener('keydown', function (e) {
                    var tag = (document.activeElement && document.activeElement.tagName) || '';
                    if (/INPUT|TEXTAREA|SELECT/i.test(tag)) return;
                    if (e.altKey && e.key === 'ArrowUp') {
                        e.preventDefault();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                        return;
                    }
                    if (e.key === 'j' || e.key === 'J') { e.preventDefault(); gotoVersion(current + 1); }
                    if (e.key === 'k' || e.key === 'K') { e.preventDefault(); gotoVersion(current - 1); }
                });

                /* 切换语言后重新渲染（类型名、未完内容、数量等文案来自语言文件） */
                document.addEventListener('i18n:change', function () {
                    if (!data.length) return;
                    render();
                    applyFilter(currentFilter);
                    observe();
                });
            }

            function load() {
                src.load().then(function (result) {
                    data = result.changelog;
                    if (!data.length) { fail(t('ui.changelog.noFiles')); return; }
                    render();
                    if (result.missing && result.missing.length) warnMissing(result.missing);
                    applyFilter(currentFilter);
                    observe();
                    revealHash();
                }).catch(function (err) {
                    fail(err && err.code === 'empty'
                        ? t('ui.changelog.noFiles')
                        : ((err && err.message) || String(err)));
                });
            }

            function start() {
                bind();
                load();
            }

            /* 内联脚本先于 defer 的 language.js 执行，等语言文件就绪再渲染 */
            if (window.I18N && window.I18N.ready) window.I18N.ready.then(start, start);
            else start();
        })();
    </script>

    <script src="../Resource/JS/language.js?v=3e933278" defer></script>
    <script src="../Resource/JS/shell.js?v=3e933278" defer></script>
    <script src="../Resource/JS/transition.js?v=3e933278" defer></script>
    <script src="../Resource/JS/effects.js?v=3e933278" defer></script>
    <script src="../Resource/JS/last-modified.js?v=3e933278" defer></script>
    <script src="../Resource/JS/time.js?v=3e933278" defer></script>
</body>
