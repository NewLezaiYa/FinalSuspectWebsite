<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#030308">
    <script>try{if(localStorage.getItem('fs.theme')==='light'){document.documentElement.setAttribute('data-theme','light');var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content','#eef1f7')}}catch(e){}</script>
    <meta name="description" content="FinalSuspect 完整更新日志：按版本倒序记录修复、优化、新增、调整与移除的全部改动。">
    <title>更新日志 · FinalSuspect</title>

    <link rel="stylesheet" href="../Resource/CSS/fonts.css?v=b8d0de44">
    <link rel="stylesheet" href="../Resource/CSS/icons.css?v=b8d0de44">
    <link rel="stylesheet" href="../Resource/CSS/variables.css?v=b8d0de44">
    <link rel="stylesheet" href="../Resource/CSS/components.css?v=b8d0de44">
    <link rel="stylesheet" href="../Resource/CSS/layout.css?v=b8d0de44">
    <link rel="stylesheet" href="../Resource/CSS/pages.css?v=b8d0de44">
    <link rel="stylesheet" href="../Resource/CSS/animations.css?v=b8d0de44">
    <link rel="stylesheet" href="../Resource/CSS/responsive.css?v=b8d0de44">
    <link rel="stylesheet" href="../Resource/CSS/theme.css?v=b8d0de44">
</head>

<body data-shell="full" data-page="changelog" data-rail="logs" data-toc="off">
    <main>
        <header class="page-head">
            <span class="page-head__label hud-label"><i class="fas fa-clock-rotate-left"></i> ARCHIVE · RELEASES</span>
            <h1 class="page-title">版本更新日志</h1>
            <div class="page-head__meta">
                <span><i class="fas fa-folder"></i> 动态</span>
                <span><i class="fas fa-code-branch"></i> <b id="clVersionCount">—</b> 个版本</span>
                <span><i class="fas fa-list-check"></i> <b id="clItemCount">—</b> 条改动</span>
                <span><i class="fas fa-clock"></i> 更新于 <time data-last-modified datetime=""></time></span>
            </div>
        </header>

        <p class="lede">
            按时间倒序排列的完整改动记录。每个版本标注对应官方游戏版本与 BepInEx 框架版本，
            改动按「修复 / 优化 / 调整 / 新增 / 移除」分类，便于快速定位你关心的部分。
        </p>

        <div class="facts">
            <div><span class="k">最新版本</span><span class="v" id="clLatest">—</span></div>
            <div><span class="k">收录区间</span><span class="v" id="clRange">—</span></div>
            <div><span class="k">改动总量</span><span class="v" id="clTotal">—</span></div>
            <div><span class="k">改动分类</span><span class="v">修复 / 优化 / 调整 / 新增 / 移除</span></div>
        </div>




        <div class="chips" id="clChips" role="group" aria-label="按改动类型筛选">
            <button class="chip" type="button" data-filter="all" aria-pressed="true">全部改动</button>
            <button class="chip" type="button" data-filter="fix" aria-pressed="false">修复</button>
            <button class="chip" type="button" data-filter="opt" aria-pressed="false">优化</button>
            <button class="chip" type="button" data-filter="change" aria-pressed="false">调整</button>
            <button class="chip" type="button" data-filter="add" aria-pressed="false">新增</button>
            <button class="chip" type="button" data-filter="remove" aria-pressed="false">移除</button>
            <button class="chip" type="button" data-filter="reset" aria-pressed="false">重置</button>
        </div>


        <div class="timeline" id="changelogTimeline">
            <noscript>
                <div class="alert alert--warn">
                    <span class="alert__icon"><i class="fas fa-triangle-exclamation"></i></span>
                    <div class="alert__body">
                        <span class="alert__title">需要启用 JavaScript</span>
                        <p>更新日志由结构化数据渲染，请开启 JavaScript 后刷新页面。</p>
                    </div>
                </div>
            </noscript>
        </div>

        <div class="alert alert--tip" style="margin-top:var(--s-6)">
            <span class="alert__icon"><i class="fas fa-lightbulb"></i></span>
            <div class="alert__body">
                <span class="alert__title">找不到你关心的改动？</span>
                <p>用页面顶部的搜索（<kbd>Ctrl</kbd> + <kbd>K</kbd>）可以直接跳转到功能或选项说明，
                    也可以先去 <a href="FAQ">疑难解答</a> 看看是否是已知问题。</p>
            </div>
        </div>
    </main>

    <script src="../Resource/JS/changelog-data.js?v=b8d0de44"></script>
    <script>
        (function () {
            var KIND = {
                fix: { label: '修复', icon: 'fa-wrench', cls: 'fix' },
                opt: { label: '优化', icon: 'fa-gauge-high', cls: 'opt' },
                change: { label: '调整', icon: 'fa-sliders', cls: 'change' },
                add: { label: '新增', icon: 'fa-plus', cls: 'add' },
                remove: { label: '移除', icon: 'fa-minus', cls: 'remove' },
                reset: { label: '重置', icon: 'fa-rotate-left', cls: 'reset' }
            };

            var data = window.CHANGELOG || [];
            var host = document.getElementById('changelogTimeline');
            if (!host || !data.length) return;

            function tagTone(k) {
                return ({
                    fix: 'red', opt: 'cyan', change: 'amber',
                    add: 'green', remove: 'purple', reset: 'pink'
                })[k] || 'cyan';
            }

            var esc = function (s) {
                return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
                });
            };

            var totalItems = 0;
            var html = '';

            data.forEach(function (v, vi) {
                var counts = {};
                var vTotal = 0;
                v.groups.forEach(function (g) {
                    counts[g.kind] = (counts[g.kind] || 0) + g.items.length;
                    vTotal += g.items.length;
                });
                totalItems += vTotal;

                var stats = Object.keys(counts).map(function (k) {
                    var meta = KIND[k] || { label: k, cls: 'change' };
                    return '<span class="tag tag--' + tagTone(k) + '">' + meta.label + ' ' + counts[k] + '</span>';
                }).join('');

                var groupsHtml = v.groups.map(function (g) {
                    var meta = KIND[g.kind] || { label: g.kind, icon: 'fa-circle', cls: 'change' };
                    var items = g.items.map(function (t) {
                        return '<div class="tl-item" data-kind="' + g.kind + '">' + esc(t) + '</div>';
                    }).join('');
                    return '' +
                        '<section class="tl-group" data-kind="' + g.kind + '">' +
                          '<h4 class="tl-group__title ' + 'c-' + meta.cls + '">' +
                            '<i class="fas ' + meta.icon + ' bg-' + meta.cls + '"></i>' +
                            esc(g.title || meta.label) +
                            '<span class="cnt">' + g.items.length + ' 项</span>' +
                          '</h4>' +
                          '<div class="tl-list">' + items + '</div>' +
                        '</section>';
                }).join('');

                html += '' +
                    '<article class="tl-version" id="' + esc(v.id) + '" data-version="' + esc(v.version) + '">' +
                      '<header class="tl-version__head">' +
                        '<span class="tl-version__num">v' + esc(v.version) + '</span>' +
                        '<span class="tag tag--' + (v.type === '正式版' ? 'green' : 'amber') + '">' + esc(v.type) + '</span>' +
                        '<span class="tl-version__date"><i class="fas fa-calendar-day"></i> ' + esc(v.date) + '</span>' +
                        '<span class="tl-version__stats">' + stats + '</span>' +
                      '</header>' +
                      groupsHtml +
                    '</article>';
            });

            host.innerHTML = html;

            var latest = data[0];
            var oldest = data[data.length - 1];
            var set = function (id, text) {
                var n = document.getElementById(id);
                if (n) n.textContent = text;
            };
            set('clVersionCount', data.length);
            set('clItemCount', totalItems);
            set('clTotal', totalItems + ' 条');
            set('clLatest', 'v' + latest.version + ' · ' + latest.date);
            set('clRange', oldest.date + ' ~ ' + latest.date);

            var current = 0;

            function gotoVersion(i) {
                i = Math.max(0, Math.min(data.length - 1, i));
                var v = data[i];
                var el = document.getElementById(v.id);
                if (!el) return;
                current = i;
                window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 132, behavior: 'smooth' });
                history.replaceState(null, '', '#' + v.id);
            }

            document.addEventListener('keydown', function (e) {
                var tag = (document.activeElement && document.activeElement.tagName) || '';
                if (/INPUT|TEXTAREA|SELECT/i.test(tag)) return;
                if (e.altKey && e.key === 'ArrowUp') {
                    e.preventDefault();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }
                if (e.key === 'j' || e.key === 'J') { e.preventDefault(); gotoVersion(current + 1); }
                if (e.key === 'k' || e.key === 'K') { e.preventDefault(); gotoVersion(current - 1); }
            });

            if ('IntersectionObserver' in window) {
                var obs = new IntersectionObserver(function (entries) {
                    entries.forEach(function (en) {
                        if (!en.isIntersecting) return;
                        var i = data.findIndex(function (v) { return v.id === en.target.id; });
                        if (i !== -1) current = i;
                    });
                }, { rootMargin: '-140px 0px -70% 0px', threshold: 0 });
                host.querySelectorAll('.tl-version').forEach(function (a) { obs.observe(a); });
            }

            if (location.hash) {
                var i0 = data.findIndex(function (v) { return v.id === location.hash.slice(1); });
                if (i0 !== -1) current = i0;
            }

            var chips = document.querySelectorAll('#clChips .chip');
            Array.prototype.forEach.call(chips, function (chip) {
                chip.addEventListener('click', function () {
                    var f = chip.dataset.filter;
                    Array.prototype.forEach.call(chips, function (c) {
                        c.setAttribute('aria-pressed', String(c === chip));
                    });
                    Array.prototype.forEach.call(host.querySelectorAll('.tl-group'), function (g) {
                        g.style.display = (f === 'all' || g.dataset.kind === f) ? '' : 'none';
                    });
                    
                    Array.prototype.forEach.call(host.querySelectorAll('.tl-version'), function (v) {
                        var visible = Array.prototype.some.call(v.querySelectorAll('.tl-group'), function (g) {
                            return g.style.display !== 'none';
                        });
                        v.style.display = visible ? '' : 'none';
                    });
                });
            });
        })();
</script>
    <script src="../Resource/JS/language.js?v=b8d0de44"></script>
    <script src="../Resource/JS/versions.js?v=b8d0de44"></script>
    <script src="../Resource/JS/shell.js?v=b8d0de44"></script>
    <script src="../Resource/JS/transition.js?v=b8d0de44" defer></script>
    <script src="../Resource/JS/effects.js?v=b8d0de44" defer></script>
    <script src="../Resource/JS/time.js?v=b8d0de44" defer></script>
    <script src="../Resource/JS/last-modified.js?v=b8d0de44" defer></script>
</body>

</html>
