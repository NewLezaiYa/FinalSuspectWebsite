<body data-shell="full" data-page="update" data-rail="guide">
    <main>
        <header class="page-head">
            <h1 class="page-title" data-i18n="p.title">更新模组</h1>
            <div class="page-head__meta">
                <span><i class="fas fa-clock"></i> <span data-i18n="ui.updated">更新于</span> <time data-last-modified datetime=""></time></span>
            </div>
        </header>

        <div class="prose">

            <h2 class="sec-title" id="auto" data-i18n="p.auto">自动更新</h2>
            <p data-i18n-html="p.autoBody1">
                Final Suspect 已于游戏内<strong>内置更新检查</strong>，每次启动将自动检查更新。
            </p>
            <p data-i18n="p.autoBody2">
                在有更新时会要求您更新，否则您无法继续游玩。
            </p>
            <p data-i18n-html="p.autoBody3">
                有关更新的详细信息，请查看<a href="../Changelog.html">版本更新日志</a>。
            </p>

            <div class="alert alert--tip">
                <span class="alert__icon"><i class="fas fa-circle-info"></i></span>
                <div class="alert__body">
                    <span class="alert__title" data-i18n="p.autoAlertTitle">两个渠道的检查逻辑不同</span>
                    <p data-i18n-html="p.autoAlertBody"><mark>Release</mark> 版本与 <mark>OpenBeta</mark> 版本的更新检查逻辑不同：
                        Release 不会要求您更新到 OpenBeta 版本，而 OpenBeta 则不会进行更新检查。</p>
                </div>
            </div>

            <h2 class="sec-title" id="when" data-i18n="p.when">何时需要手动更新</h2>

            <div class="alert alert--warn">
                <span class="alert__icon"><i class="fas fa-triangle-exclamation"></i></span>
                <div class="alert__body">
                    <span class="alert__title" data-i18n="p.whenAlertTitle">优先选择自动更新</span>
                    <p data-i18n="p.whenAlertBody1">如非必要，我们建议您优先选择自动更新。</p>
                    <p data-i18n="p.whenAlertBody2">1.5.0版本需要手动更新，因为Steam端的游戏更新至了64位。</p>
                </div>
            </div>
        </div>

        <div class="pager">
            <a class="pager__item" href="Installation.html">
                <small data-i18n="ui.prev">上一篇</small>
                <b>← <span data-i18n="p.pagerPrev">安装模组</span></b>
            </a>
            <a class="pager__item pager__item--next" href="OutputLog.html">
                <small data-i18n="ui.next">下一篇</small>
                <b><span data-i18n="p.pagerNext">导出日志</span> →</b>
            </a>
        </div>
    </main>
