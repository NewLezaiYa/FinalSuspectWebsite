<body data-shell="full" data-page="update" data-rail="guide">
    <main>
        <header class="page-head">
            <h1 class="page-title">更新模组</h1>
            <div class="page-head__meta">
                <span><i class="fas fa-clock"></i> 更新于 <time data-last-modified datetime=""></time></span>
            </div>
        </header>

        <div class="prose">

            <h2 class="sec-title" id="auto">自动更新</h2>
            <p>
                Final Suspect 已于游戏内<strong>内置更新检查</strong>，每次启动将自动检查更新。
            </p>
            <p>
                在有更新时会要求您更新，否则您无法继续游玩。
            </p>
            <p>
                有关更新的详细信息，请查看<a href="../Changelog.html">版本更新日志</a>。
            </p>

            <div class="alert alert--tip">
                <span class="alert__icon"><i class="fas fa-circle-info"></i></span>
                <div class="alert__body">
                    <span class="alert__title">两个渠道的检查逻辑不同</span>
                    <p><mark>Release</mark> 版本与 <mark>OpenBeta</mark> 版本的更新检查逻辑不同：
                        Release 不会要求您更新到 OpenBeta 版本，而 OpenBeta 则不会进行更新检查。</p>
                </div>
            </div>

            <h2 class="sec-title" id="when">何时需要手动更新</h2>

            <div class="alert alert--warn">
                <span class="alert__icon"><i class="fas fa-triangle-exclamation"></i></span>
                <div class="alert__body">
                    <span class="alert__title">优先选择自动更新</span>
                    <p>如非必要，我们建议您优先选择自动更新。</p>
                    <p>1.5.0版本需要手动更新，因为Steam端的游戏更新至了64位。</p>
                </div>
            </div>
        </div>

        <div class="pager">
            <a class="pager__item" href="Installation.html">
                <small>上一篇</small>
                <b>← 安装模组</b>
            </a>
            <a class="pager__item pager__item--next" href="OutputLog.html">

            </a>
        </div>
